<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CheckPro — Sistema de Inspección Industrial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --orange: #f97316;
      --orange-dark: #ea580c;
      --orange-dim: rgba(249, 115, 22, 0.12);
      --black: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --surface3: #242424;
      --border: rgba(255,255,255,0.07);
      --border-lit: rgba(249,115,22,0.35);
      --text: #f0f0f0;
      --text-soft: #888;
      --text-dim: #555;
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.12);
      --success: #22c55e;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { scroll-behavior:smooth; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--orange);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(249,115,22,0.4);
    }

    .logo-icon .material-icons-round { font-size: 20px; color: white; }

    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1px;
      color: var(--text);
    }

    .logo-text span { color: var(--orange); }

    .header-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--orange-dim);
      color: var(--orange);
      border: 1px solid var(--border-lit);
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── TABS ── */
    .tabs-container {
      position: sticky;
      top: 60px;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
    }

    .tabs {
      display: flex;
      background: var(--surface2);
      padding: 4px;
      border-radius: 12px;
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-soft);
      cursor: pointer;
      border-radius: 9px;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab .material-icons-round { font-size: 16px; }

    .tab:hover:not(.active) { background: var(--surface3); color: var(--text); }

    .tab.active {
      background: var(--orange);
      color: white;
      box-shadow: 0 4px 14px rgba(249,115,22,0.35);
    }

    .tab.insp-tab.active { background: #7c3aed; box-shadow: 0 4px 14px rgba(124,58,237,0.35); }

    /* ── MAIN ── */
    main {
      padding: 16px;
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: 110px;
    }

    /* ── SECTION ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-soft);
    }

    select, input, textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width%3D'292.4' height%3D'292.4'%3E%3Cpath fill%3D'%23888' d%3D'M287 69.4a17.6 17.6 0 0 0-13-5.4H18.4c-5 0-9.3 1.8-12.9 5.4A17.6 17.6 0 0 0 0 82.2c0 5 1.8 9.3 5.4 12.9l128 127.9c3.6 3.6 7.8 5.4 12.8 5.4s9.2-1.8 12.8-5.4L287 95c3.5-3.5 5.4-7.8 5.4-12.8 0-5-1.9-9.2-5.5-12.8z'%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px top 50%;
      background-size: 8px;
      padding-right: 32px;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--orange);
      background: var(--surface3);
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
    }

    select option { background: var(--surface2); }

    /* ── ZONA SELECT ── */
    .zona-select {
      font-family: 'Barlow Condensed', sans-serif !important;
      font-size: 17px !important;
      font-weight: 800 !important;
      letter-spacing: 0.5px;
      border-color: var(--border-lit) !important;
      color: var(--orange) !important;
    }

    /* ── EQUIPO ── */
    .equipo {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .equipo.abierto {
      border-color: var(--border-lit);
      box-shadow: 0 0 20px rgba(249,115,22,0.08);
    }

    .equipo-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .equipo-head:active { background: var(--surface3); }

    .equipo-nombre {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .equipo-num {
      background: var(--surface3);
      color: var(--text-soft);
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      transition: all 0.3s;
      border: 1px solid var(--border);
    }

    .equipo.abierto .equipo-num {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
      box-shadow: 0 0 10px rgba(249,115,22,0.4);
    }

    .equipo-toggle {
      width: 28px; height: 28px;
      background: var(--surface3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-soft);
      transition: transform 0.35s ease, background 0.2s, color 0.2s;
      border: 1px solid var(--border);
    }

    .equipo-toggle .material-icons-round { font-size: 16px; }

    .equipo.abierto .equipo-toggle {
      transform: rotate(180deg);
      background: var(--orange-dim);
      color: var(--orange);
      border-color: var(--border-lit);
    }

    .equipo-body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 18px;
      transition: max-height 0.4s ease, opacity 0.35s ease, padding 0.35s ease;
      background: var(--surface);
    }

    .equipo.abierto .equipo-body {
      max-height: 3000px;
      opacity: 1;
      padding: 6px 18px 18px;
      border-top: 1px solid var(--border);
    }

    /* ── CHECKPOINT ── */
    .checkpoint {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .checkpoint::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--surface3);
      transition: background 0.3s;
    }

    .checkpoint.marcado {
      border-color: rgba(239,68,68,0.3);
      background: var(--danger-dim);
    }

    .checkpoint.marcado::before { background: var(--danger); }

    .check-header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .check-texto {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-soft);
      line-height: 1.4;
      flex: 1;
      transition: color 0.2s;
    }

    .checkpoint.marcado .check-texto { color: #fca5a5; font-weight: 600; }

    /* Toggle switch dark */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px; height: 28px;
      flex-shrink: 0;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface3);
      border: 1px solid var(--border);
      transition: .35s ease;
      border-radius: 34px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 22px; width: 22px;
      left: 2px; bottom: 2px;
      background: var(--text-soft);
      transition: .35s ease;
      border-radius: 50%;
    }

    input:checked + .toggle-slider { background: rgba(239,68,68,0.25); border-color: var(--danger); }
    input:checked + .toggle-slider:before { transform: translateX(22px); background: var(--danger); }

    .toggle-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 44px;
      text-align: right;
      transition: color 0.2s;
    }

    input:checked ~ .toggle-label { color: var(--danger); }

    .check-comment {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .checkpoint.marcado .check-comment { max-height: 160px; opacity: 1; margin-top: 12px; }

    .check-comment textarea {
      min-height: 70px;
      resize: vertical;
      border-color: rgba(239,68,68,0.3);
      font-size: 13px;
    }

    .check-comment textarea:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }

    /* ── ACTION DOCK ── */
    .action-dock {
      position: fixed;
      bottom: 16px; left: 16px; right: 16px;
      max-width: 800px;
      margin: 0 auto;
      background: rgba(20,20,20,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(249,115,22,0.1);
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 11px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    button:active:not(:disabled) { transform: scale(0.97); }

    button:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

    .btn-primary {
      background: var(--orange);
      color: white;
      flex: 2;
      box-shadow: 0 4px 14px rgba(249,115,22,0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--orange-dark);
      box-shadow: 0 6px 20px rgba(249,115,22,0.4);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-soft);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { background: var(--surface3); color: var(--text); }

    /* ── MODAL LOGIN ── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 36px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 72px; height: 72px;
      background: var(--orange-dim);
      border: 1px solid var(--border-lit);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }

    .modal-icon .material-icons-round { font-size: 36px; color: var(--orange); }

    .modal-content h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .modal-content p { font-size: 13px; color: var(--text-soft); margin-bottom: 24px; line-height: 1.5; }

    /* ── INSPECCIÓN MODAL ── */
    #modalInspeccion {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 9999;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .insp-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 800px;
      max-height: 92dvh;
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -12px 48px rgba(0,0,0,0.5);
      animation: slideUp 0.35s cubic-bezier(0.34, 1.1, 0.64, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .insp-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
      background: var(--surface2);
    }

    .insp-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .insp-title .material-icons-round { color: #7c3aed; font-size: 20px; }

    .insp-subtitle { font-size: 12px; color: var(--text-soft); margin-top: 3px; }

    .insp-meta {
      font-size: 11px;
      font-weight: 600;
      color: var(--orange);
      background: var(--orange-dim);
      border: 1px solid var(--border-lit);
      padding: 4px 10px;
      border-radius: 8px;
      margin-top: 8px;
      display: inline-flex;
      gap: 8px;
    }

    .insp-close {
      background: var(--surface3) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-soft) !important;
      flex: 0 !important;
      width: 36px !important;
      height: 36px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      box-shadow: none !important;
    }

    .insp-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .insp-body::-webkit-scrollbar { display: none; }

    .insp-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: var(--surface2);
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .insp-punto {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .insp-punto-header { display: flex; justify-content: space-between; align-items: center; }

    .insp-punto-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--orange);
      background: var(--orange-dim);
      border: 1px solid var(--border-lit);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .insp-btn-del {
      background: var(--danger-dim) !important;
      color: var(--danger) !important;
      border: 1px solid rgba(239,68,68,0.3) !important;
      flex: 0 !important;
      width: 30px !important; height: 30px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      box-shadow: none !important;
    }

    .btn-add {
      flex: 0 !important;
      min-width: 48px !important;
      height: 48px !important;
      padding: 0 !important;
      border-radius: 11px !important;
      background: var(--surface3) !important;
      color: var(--text-soft) !important;
      border: 1px dashed var(--border) !important;
      font-size: 22px !important;
    }

    .btn-send {
      flex: 1 !important;
      height: 48px !important;
      background: #7c3aed !important;
      color: white !important;
      box-shadow: 0 4px 14px rgba(124,58,237,0.3) !important;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 14px;
    }

    .status-user {
      font-size: 13px;
      font-weight: 600;
      color: var(--orange);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-user .material-icons-round { font-size: 16px; }

    .btn-logout {
      background: none !important;
      border: 1px solid var(--border) !important;
      color: var(--text-soft) !important;
      flex: none !important;
      padding: 6px 12px !important;
      border-radius: 8px !important;
      font-size: 11px !important;
      box-shadow: none !important;
    }

    /* ── TICKET FORM ── */
    .ticket-urgency-row { display: flex; gap: 8px; margin-top: 4px; }

    .urgency-chip {
      flex: 1;
      padding: 10px 6px;
      border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-align: center;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text-soft);
      transition: all 0.2s;
    }

    .urgency-chip.selected-low  { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.1); }
    .urgency-chip.selected-med  { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }
    .urgency-chip.selected-high { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); }

    /* ── TOAST ── */
    #cp-toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 12px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s;
      max-width: 90vw;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── DEMO BADGE ── */
    .demo-ribbon {
      position: fixed;
      top: 0; right: 0;
      background: var(--orange);
      color: white;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;

<body>

<!-- MODAL INSPECCIÓN -->

<main id="main"></main>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const API_URL = ''; // Tu endpoint aquí

const LINEAS = {
  "Línea Envasado A": [
    { nombre: "Llenadora rotativa", checks: ["El equipo no funciona correctamente","Fugas de producto en válvulas","Nivel de presión fuera de rango","Velocidad de llenado inconsistente","Las botoneras no responden","Ruidos anormales en cabezales","Temperatura de sellado incorrecta","Otros"] },

    { nombre: "Transportador de salida", checks: ["Cinta desalineada","Velocidad irregular","Rodamientos con ruido","Guías de producto sueltas","Motor con temperatura elevada","Otros"] }
  ],
  "Planta Metalmecánica": [
    { nombre: "Torno CNC #1", checks: ["Error en husillo principal","Refrigerante bajo o contaminado","Falla en sistema de cambio de herramienta","Guías de bancada con desgaste","Ruido en caja de engranajes","Pantalla HMI con errores","Otros"] },
    { nombre: "Fresadora CNC #2", checks: ["Vibración en cabezal","Sistema de vacío con pérdidas","Mesa de trabajo con huelgo","Error de posicionamiento","Falla de encoder","Filtros de viruta tapados","Otros"] },
    { nombre: "Soldadura MIG #3", checks: ["Inestabilidad del arco","Presión de gas protector baja","Alimentador de hilo con falla","Antorcha con desgaste","Cable de masa en mal estado","Otros"] },
    { nombre: "Compresor de planta", checks: ["Presión de trabajo fuera de rango","Temperatura de descarga elevada","Pérdidas de aire en conexiones","Filtro de admisión tapado","Nivel de aceite bajo","Correas en mal estado","Otros"] }
  ],
  "Proceso Químico — Planta 2": [
    { nombre: "Reactor R-101", checks: ["Temperatura fuera de set point","Agitador con vibración anormal","Sello mecánico con pérdidas","Válvula de control atascada","Sensor de pH con deriva","Presión interna anormal","Válvula de seguridad activa","Otros"] },
    { nombre: "Bomba centrífuga B-01", checks: ["Cavitación audible","Sellos mecánicos con goteo","Temperatura de cojinetes elevada","Caudal por debajo del nominal","Vibración excesiva en eje","Ruido anormal en impulsor","Otros"] },
    { nombre: "Intercambiador de calor E-201", checks: ["Diferencial de temperatura fuera de rango","Posible ensuciamiento de placas","Pérdida de fluido en juntas","Corrosión visible en nozzles","Flujo del lado carcaza reducido","Otros"] },
    { nombre: "Sistema de ventilación", checks: ["Caudal de extracción reducido","Filtros con alta caída de presión","Rodamientos con ruido","Correas con desgaste","Temperatura de motor elevada","Damper sin respuesta","Otros"] }
  ],
  "Utilities / Servicios": [
    { nombre: "Calderas — Sala de vapor", checks: ["Presión de operación fuera de rango","Nivel de agua bajo","Válvula de seguridad activada","Purgas no funcionan","Pérdida de vapor en líneas","Color de llama anormal","Otros"] },
    { nombre: "Sistema de agua helada", checks: ["Temperatura de agua de retorno alta","Compresor con alta temperatura de descarga","Nivel de refrigerante bajo","Bomba de circulación ruidosa","Torre de enfriado con relleno tapado","Otros"] },
    { nombre: "Tablero eléctrico principal", checks: ["Alarma de falla activa","Temperatura de tablero elevada","Disyuntor disparado","Borneras con señales de calentamiento","Iluminación de tablero sin funcionar","Puerta sin seguro","Otros"] },
    { nombre: "Generador de emergencia", checks: ["Nivel de combustible bajo","Batería de arranque sin carga","Prueba de arranque fallida","Temperatura de motor elevada","Aceite bajo o contaminado","Otros"] }
  ],
  "Almacén y Expedición": [
    { nombre: "Autoelevador Eléctrico #1", checks: ["Batería con baja carga","Horquillas con desgaste","Mástil con juego excesivo","Sistema hidráulico con pérdidas","Luces de seguridad sin funcionar","Bocina inoperativa","Otros"] },
    { nombre: "Cinta de expedición", checks: ["Lona desalineada","Rodillos atascados","Encoder de velocidad falla","Fotoceldas de conteo sin señal","Motor con ruido","Otros"] },
    { nombre: "Balanza de control", checks: ["Lectura fuera de calibración","Plataforma con suciedad","Indicador con error","Comunicación con sistema perdida","Otros"] }
  ]
};

const TECNICOS = ['Carlos Mendoza','Laura Vidal','Diego Ferreyra','Ana Romero','Martín Suárez','Paula Gómez','Rodrigo Blanco','Sofía Torres'];
const SUPERVISORES = ['Ing. Roberto Casas','Ing. Valeria Ortiz','Ing. Pablo Herrera'];

const EMAILS_VALIDOS = ['demo@checkpro.app','tecnico@planta.com','supervisor@planta.com'];

let currentTab = 'rutinas';
let app = {
  linea: 'Línea Envasado A',
  tecnico: '',
  supervisor: '',
  userEmail: '',
  datos: {},
  abiertos: {}
};

// ── AUTH ───────────────────────────────────────────────────────────────────────
function checkLogin() {
  if (!app.userEmail) {
    document.getElementById('loginModal').style.display = 'flex';
    return false;
  }
  document.getElementById('loginModal').style.display = 'none';
  return true;
}

function loginManual() {
  const em = document.getElementById('manualEmail').value.trim();
  if (!em.includes('@')) { showToast('⚠ Email inválido', 'warning'); return; }
  app.userEmail = em;
  if (checkLogin()) render();
}

// ── TABS ───────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  ['rutinas','tickets','inspeccion'].forEach(t => {
    document.getElementById('tab-' + t)?.classList.remove('active');
  });
  document.getElementById('tab-' + tab).classList.add('active');
  render();
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
function render() {
  if (!checkLogin()) return;
  currentTab === 'tickets' ? renderTickets() : renderRutinas();
}

function renderTickets() {
  document.getElementById('main').innerHTML = `
    <div class="status-bar">
      <div class="status-user"><span class="material-icons-round">account_circle</span>${app.userEmail}</div>
      <button class="btn-logout" onclick="app.userEmail=''; checkLogin()">
        <span class="material-icons-round" style="font-size:14px;">logout</span>
      </button>
    </div>
    <div class="section">
      <div class="section-label">Nuevo ticket de mantenimiento</div>
      <div class="field" style="margin-bottom:12px;">
        <label class="label">Categoría</label>
        <select id="tCat">
          <option>Mecánico</option><option>Eléctrico</option>
          <option>Instrumentación</option><option>Civil / Edilicio</option><option>Otro</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label class="label">Área / Ubicación</label>
        <input type="text" id="tArea" placeholder="Ej: Sala de bombas — Planta 2">
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label class="label">Descripción del problema</label>
        <textarea id="tDesc" placeholder="Detallá el problema encontrado..." style="min-height:110px;"></textarea>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label class="label">Urgencia</label>
        <div class="ticket-urgency-row">
          <div class="urgency-chip selected-low"  onclick="selectUrgency(this,'Baja')">Baja</div>
          <div class="urgency-chip selected-med"  onclick="selectUrgency(this,'Media')">Media</div>
          <div class="urgency-chip"               onclick="selectUrgency(this,'Alta')">Alta</div>
        </div>
      </div>
      <button class="btn-primary" onclick="guardarTicket()" style="width:100%;">
        <span class="material-icons-round">send</span> Enviar ticket
      </button>
    </div>`;
}

let urgenciaSelected = 'Media';
function selectUrgency(el, val) {
  urgenciaSelected = val;
  document.querySelectorAll('.urgency-chip').forEach(c => {
    c.classList.remove('selected-low','selected-med','selected-high');
  });
  el.classList.add(val === 'Baja' ? 'selected-low' : val === 'Media' ? 'selected-med' : 'selected-high');
}

function guardarTicket() {
  const area = document.getElementById('tArea')?.value?.trim();
  const desc = document.getElementById('tDesc')?.value?.trim();
  if (!area || !desc) { showToast('⚠ Completá área y descripción', 'warning'); return; }
  showToast('✓ Ticket registrado correctamente', 'success');
  switchTab('rutinas');
}

function renderRutinas() {
  const equipos = LINEAS[app.linea] || [];
  let html = `
    <div class="status-bar">
      <div class="status-user"><span class="material-icons-round">account_circle</span>${app.userEmail}</div>
      <button class="btn-logout" onclick="app.userEmail=''; checkLogin()">
        <span class="material-icons-round" style="font-size:14px;">logout</span>
      </button>
    </div>
    <div class="section">
      <div class="field">
        <label class="label">Planta / Zona de inspección</label>
        <select class="zona-select" onchange="cambiarLinea(this.value)">
          ${Object.keys(LINEAS).map(l => `<option ${app.linea===l?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="section grid2">
      <div class="field">
        <label class="label">Técnico responsable *</label>
        <select onchange="app.tecnico=this.value; updateBtnGuardar()">
          <option value="">— Seleccionar —</option>
          ${TECNICOS.map(t=>`<option ${app.tecnico===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label class="label">Supervisor de turno *</label>
        <select onchange="app.supervisor=this.value; updateBtnGuardar()">
          <option value="">— Seleccionar —</option>
          ${SUPERVISORES.map(s=>`<option ${app.supervisor===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label class="label">Fecha</label>
        <input type="text" value="${new Date().toLocaleDateString('es-AR')}" disabled style="opacity:.5;">
      </div>
    </div>`;

  equipos.forEach((eq, ei) => {
    if (!app.datos[ei]) app.datos[ei] = {};
    html += `<div class="equipo ${app.abiertos[ei]?'abierto':''}" data-equipo="${ei}">
      <div class="equipo-head" onclick="toggleEquipo(${ei})">
        <div class="equipo-nombre">
          <span class="equipo-num">${ei+1}</span>${eq.nombre}
        </div>
        <div class="equipo-toggle"><span class="material-icons-round">expand_more</span></div>
      </div>
      <div class="equipo-body">`;

    eq.checks.forEach((cp, ci) => {
      if (!app.datos[ei][ci]) app.datos[ei][ci] = { m: false, c: '' };
      const d = app.datos[ei][ci];
      html += `<div class="checkpoint ${d.m?'marcado':''}" data-cp="${ei}-${ci}">
        <div class="check-header">
          <div class="check-texto">${cp}</div>
          <label class="toggle-switch">
            <input type="checkbox" ${d.m?'checked':''} onchange="toggleCheck(${ei},${ci})">
            <div class="toggle-slider"></div>
          </label>
          <div class="toggle-label">${d.m?'FALLA':'OK'}</div>
        </div>
        <div class="check-comment">
          <textarea onchange="updateComent(${ei},${ci},this.value)"
                    placeholder="Describí el hallazgo..." rows="2">${d.c}</textarea>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  html += `<div class="action-dock">
    <button class="btn-ghost" onclick="limpiarDatos()" title="Limpiar">
      <span class="material-icons-round">refresh</span>
    </button>
    <button class="btn-primary" id="btnGuardar" onclick="guardarRutina()"
            ${!app.tecnico||!app.supervisor?'disabled':''}>
      <span class="material-icons-round">send</span> Finalizar rutina
    </button>
    <button class="btn-ghost" onclick="exportarCSV()" title="Exportar">
      <span class="material-icons-round">download</span>
    </button>
  </div>`;

  document.getElementById('main').innerHTML = html;
}

function cambiarLinea(val) {
  app.linea = val;
  app.datos = {};
  app.abiertos = {};
  render();
}

function toggleEquipo(ei) {
  app.abiertos[ei] = !app.abiertos[ei];
  const el = document.querySelector(`[data-equipo="${ei}"]`);
  if (el) app.abiertos[ei] ? el.classList.add('abierto') : el.classList.remove('abierto');
}

function toggleCheck(ei, ci) {
  if (!app.datos[ei]) app.datos[ei] = {};
  if (!app.datos[ei][ci]) app.datos[ei][ci] = { m: false, c: '' };
  app.datos[ei][ci].m = !app.datos[ei][ci].m;
  const el = document.querySelector(`[data-cp="${ei}-${ci}"]`);
  if (el) {
    app.datos[ei][ci].m ? el.classList.add('marcado') : el.classList.remove('marcado');
    const lbl = el.querySelector('.toggle-label');
    if (lbl) lbl.textContent = app.datos[ei][ci].m ? 'FALLA' : 'OK';
  }
}

function updateComent(ei, ci, val) {
  if (!app.datos[ei]) app.datos[ei] = {};
  if (!app.datos[ei][ci]) app.datos[ei][ci] = { m: false, c: '' };
  app.datos[ei][ci].c = val;
}

function updateBtnGuardar() {
  const btn = document.getElementById('btnGuardar');
  if (btn) btn.disabled = !app.tecnico || !app.supervisor;
}

function limpiarDatos() {
  if (!confirm('¿Limpiar la rutina actual?')) return;
  app.datos = {}; app.abiertos = {};
  render();
}

function guardarRutina() {
  if (!app.tecnico || !app.supervisor) return;
  showToast('✓ Rutina enviada al sistema', 'success');
  app.tecnico = ''; app.supervisor = ''; app.datos = {}; app.abiertos = {};
  render();
}

function exportarCSV() {
  showToast('⬇ Exportando CSV...', 'info');
}

// ── INSPECCIÓN ─────────────────────────────────────────────────────────────────
let inspPuntos = [];

function abrirInspeccion() {
  if (!app.tecnico || !app.supervisor) {
    showToast('⚠ Seleccioná técnico y supervisor primero', 'warning');
    return;
  }
  const meta = document.getElementById('insp-meta');
  if (meta) meta.textContent = `👤 ${app.tecnico}  ·  🔍 ${app.supervisor}`;
  inspPuntos = [];
  renderPuntos();
  agregarPunto();
  document.getElementById('modalInspeccion').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function cerrarInspeccion() {
  const hayDatos = inspPuntos.some(p => p.linea || p.equipo || p.checkpoint || p.obs.trim());
  if (hayDatos && !confirm('¿Cerrar sin enviar? Se perderán los datos.')) return;
  document.getElementById('modalInspeccion').style.display = 'none';
  document.body.style.overflow = '';
  inspPuntos = [];
}

function agregarPunto() {
  inspPuntos.push({ linea: '', equipo: '', checkpoint: '', obs: '' });
  renderPuntos();
  setTimeout(() => {
    const items = document.querySelectorAll('.insp-punto');
    if (items.length) items[items.length-1].scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 80);
}

function eliminarPunto(idx) {
  if (inspPuntos.length <= 1) return;
  inspPuntos.splice(idx, 1);
  renderPuntos();
}

function renderPuntos() {
  const c = document.getElementById('insp-container');
  c.innerHTML = '';
  inspPuntos.forEach((p, idx) => {
    const lineasOpts = Object.keys(LINEAS).map(l =>
      `<option value="${l}" ${p.linea===l?'selected':''}>${l}</option>`
    ).join('');
    const div = document.createElement('div');
    div.className = 'insp-punto';
    div.id = `ip-${idx}`;
    div.innerHTML = `
      <div class="insp-punto-header">
        <span class="insp-punto-num">Punto ${idx+1}</span>
        ${inspPuntos.length > 1
          ? `<button class="insp-btn-del" onclick="eliminarPunto(${idx})" type="button">
               <span class="material-icons-round" style="font-size:16px;">close</span>
             </button>` : ''}
      </div>
      <div class="field">
        <span class="label">Zona / Línea</span>
        <select id="il-${idx}" onchange="onLineaChange(${idx})">
          <option value="">— Seleccionar zona —</option>${lineasOpts}
        </select>
      </div>
      <div id="ie-wrap-${idx}"></div>
      <div id="ic-wrap-${idx}"></div>
      <div class="field">
        <span class="label">Observación</span>
        <textarea id="io-${idx}" rows="3" placeholder="Describí el hallazgo..."
          oninput="inspPuntos[${idx}].obs=this.value">${p.obs}</textarea>
      </div>`;
    c.appendChild(div);
    if (p.linea) renderEquipo(idx);
    if (p.equipo) renderCheckpoint(idx);
  });
}

function onLineaChange(idx) {
  inspPuntos[idx].linea = document.getElementById(`il-${idx}`).value;
  inspPuntos[idx].equipo = '';
  inspPuntos[idx].checkpoint = '';
  renderEquipo(idx);
  renderCheckpoint(idx);
}

function onEquipoChange(idx) {
  inspPuntos[idx].equipo = document.getElementById(`iep-${idx}`).value;
  inspPuntos[idx].checkpoint = '';
  renderCheckpoint(idx);
}

function onCheckChange(idx) {
  inspPuntos[idx].checkpoint = document.getElementById(`ich-${idx}`).value;
}

function renderEquipo(idx) {
  const w = document.getElementById(`ie-wrap-${idx}`);
  const linea = inspPuntos[idx].linea;
  if (!linea || !LINEAS[linea]) { w.innerHTML = ''; return; }
  const opts = LINEAS[linea].map(e => `<option value="${e.nombre}">${e.nombre}</option>`).join('');
  w.innerHTML = `<div class="field"><span class="label">Equipo</span>
    <select id="iep-${idx}" onchange="onEquipoChange(${idx})">
      <option value="">— Seleccionar equipo —</option>${opts}
    </select></div>`;
  if (inspPuntos[idx].equipo) document.getElementById(`iep-${idx}`).value = inspPuntos[idx].equipo;
}

function renderCheckpoint(idx) {
  const w = document.getElementById(`ic-wrap-${idx}`);
  const eq = (LINEAS[inspPuntos[idx].linea]||[]).find(e => e.nombre === inspPuntos[idx].equipo);
  if (!eq) { w.innerHTML = ''; return; }
  const opts = eq.checks.map(c => `<option value="${c}">${c}</option>`).join('');
  w.innerHTML = `<div class="field"><span class="label">Punto de control</span>
    <select id="ich-${idx}" onchange="onCheckChange(${idx})">
      <option value="">— Seleccionar punto —</option>${opts}
    </select></div>`;
  if (inspPuntos[idx].checkpoint) document.getElementById(`ich-${idx}`).value = inspPuntos[idx].checkpoint;
}

async function enviarInspeccion() {
  const tecnico    = app.tecnico?.trim();
  const supervisor = app.supervisor?.trim();
  if (!tecnico || !supervisor) { showToast('⚠ Seleccioná técnico y supervisor', 'warning'); return; }

  for (let i = 0; i < inspPuntos.length; i++) {
    const p = inspPuntos[i];
    if (!p.linea || !p.equipo || !p.checkpoint || !p.obs.trim()) {
      showToast(`⚠ Completá todos los campos del Punto ${i+1}`, 'warning');
      return;
    }
  }

  const btn = document.getElementById('insp-btn-enviar');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons-round" style="animation:spin 1s linear infinite;">sync</span> Enviando...';

  await new Promise(r => setTimeout(r, 1200)); // Demo delay

  inspPuntos = [];
  document.getElementById('modalInspeccion').style.display = 'none';
  document.body.style.overflow = '';
  showToast('✓ Inspección registrada y reportada', 'success');

  btn.disabled = false;
  btn.innerHTML = '<span class="material-icons-round">send</span> Enviar inspección';
}

// ── TOAST ──────────────────────────────────────────────────────────────────────
function showToast(msg, tipo) {
  let t = document.getElementById('cp-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'cp-toast';
    document.body.appendChild(t);
  }
  const cfg = {
    success: { bg: '#14532d', border: '#22c55e', color: '#86efac' },
    warning: { bg: '#431407', border: '#f97316', color: '#fdba74' },
    error:   { bg: '#450a0a', border: '#ef4444', color: '#fca5a5' },
    info:    { bg: '#1e1b4b', border: '#818cf8', color: '#c7d2fe' }
  };
  const c = cfg[tipo] || cfg.info;
  t.style.cssText = `
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:${c.bg}; color:${c.color};
    border:1px solid ${c.border};
    padding:11px 20px; border-radius:11px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:14px; letter-spacing:0.3px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    z-index:99999; opacity:1; transition:opacity 0.35s;
    white-space:nowrap; max-width:90vw; pointer-events:none;`;
  t.textContent = msg;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

// ── INIT ───────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
